# Producción (VPS).
#   Normal: lo despliega GitHub Actions (imágenes ya construidas en ghcr.io) con infra/desplegar.sh.
#   Manual: TAG=sha-abc1234 ./infra/desplegar.sh    ·    Construir en el propio servidor: docker compose up -d --build
# Solo Caddy expone puertos (80/443). La base de datos y la API quedan en la red interna.

name: taller

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-America/Guayaquil}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [interna]

  api:
    image: ${IMAGENES:-ghcr.io/diegosteven/tallerquito}-api:${TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      TZ: ${TZ:-America/Guayaquil}
      # Lo usa el seed inicial (docker compose exec api ./node_modules/.bin/prisma db seed)
      NUMERO_ORDEN_INICIAL: ${NUMERO_ORDEN_INICIAL:-}
      # Dominios que pueden leer la API (la landing pública), separados por coma
      CORS_ORIGENES: ${CORS_ORIGENES:-}
      # Cloudflare Pages: al guardar en "Mantenimiento web" se reconstruye la landing
      LANDING_DEPLOY_HOOK: ${LANDING_DEPLOY_HOOK:-}
    volumes:
      # Fotos subidas desde "Mantenimiento web": sobreviven a reconstruir la imagen
      - uploads:/app/uploads
    networks: [interna]

  caddy:
    image: ${IMAGENES:-ghcr.io/diegosteven/tallerquito}-web:${TAG:-latest}
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
      args:
        VITE_LANDING_URL: ${LANDING_URL:-}
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [interna]

  backup:
    image: ${IMAGENES:-ghcr.io/diegosteven/tallerquito}-backup:${TAG:-latest}
    build: ./infra/backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: postgres
      BACKUP_CRON: ${BACKUP_CRON:-0 */6 * * *}
      TZ: ${TZ:-America/Guayaquil}
    volumes:
      # En el VPS: /srv/respaldos/datos, la carpeta que la PC del taller descarga por SFTP (solo lectura).
      - ${BACKUP_DIR:-./backups}:/backups
      # Fotos de la landing (solo lectura): se copian a backups/fotos
      - uploads:/uploads:ro
    networks: [interna]

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

networks:
  interna:
