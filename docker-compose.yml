# Producción (VPS).  Uso:  docker compose up -d --build
# Solo Caddy expone puertos (80/443). La base de datos y la API quedan en la red interna.

name: taller

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-America/Guayaquil}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [interna]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      TZ: ${TZ:-America/Guayaquil}
      # Lo usa el seed inicial (docker compose exec api ./node_modules/.bin/prisma db seed)
      NUMERO_ORDEN_INICIAL: ${NUMERO_ORDEN_INICIAL:-}
      # Dominios que pueden leer la API (la landing pública), separados por coma
      CORS_ORIGENES: ${CORS_ORIGENES:-}
    volumes:
      # Fotos subidas desde "Mantenimiento web": sobreviven a reconstruir la imagen
      - uploads:/app/uploads
    networks: [interna]

  caddy:
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
      args:
        VITE_LANDING_URL: ${LANDING_URL:-}
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [interna]

  backup:
    build: ./infra/backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: postgres
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      TZ: ${TZ:-America/Guayaquil}
    volumes:
      - ./backups:/backups
      # Fotos de la landing (solo lectura): se copian a ./backups/fotos y suben a R2
      - uploads:/uploads:ro
      # Carpeta montada completa: si rclone.conf no existe, solo se guarda la copia local.
      - ./infra/backup:/config/rclone:ro
    networks: [interna]

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

networks:
  interna:
