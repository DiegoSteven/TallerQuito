# Desarrollo local: solo la base de datos (la API y la web corren con pnpm dev).
#   pnpm dev:db   →   postgresql://taller:taller@localhost:5434/taller

name: taller-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taller
      POSTGRES_USER: taller
      POSTGRES_PASSWORD: taller
      TZ: America/Guayaquil
    ports:
      - "5434:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taller -d taller"]
      interval: 5s
      retries: 10

volumes:
  pgdata-dev:
